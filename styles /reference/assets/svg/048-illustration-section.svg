.farm-route-wire path { fill: none; stroke: rgba(255, 255, 255, 0.32); stroke-width: 1px; stroke-dasharray: 1; stroke-dashoffset: 1px; animation: 0.42s cubic-bezier(0.22, 1, 0.36, 1) 0s 1 normal forwards running farm-route-draw; }
