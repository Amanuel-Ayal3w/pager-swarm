<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 578 243" width="578" height="243" class="farm-route-wire pointer-events-none absolute inset-0 hidden h-full w-full sm:block"><style>.inset-0 { inset: 0px; }
