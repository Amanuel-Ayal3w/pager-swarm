<svg aria-hidden="true" viewBox="0 0 220 190" xmlns="http://www.w3.org/2000/svg" width="240.89" height="208.03" class="w-full"><style>.w-full { width: 100%; }
.farm-route-explorer path, .farm-route-explorer circle { fill: none; stroke: rgba(255, 255, 255, 0.26); stroke-width: 1px; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; transition: stroke 0.2s linear; }
.farm-route-explorer .farm-route-faint { stroke: rgba(255, 255, 255, 0.14); }
.farm-route-explorer [data-hot] path { stroke: rgba(255, 255, 255, 0.52); }
.farm-route-explorer [data-hot] .farm-route-faint { stroke: rgba(255, 255, 255, 0.28); }
.farm-route-explorer .farm-route-dot { stroke: rgba(255, 255, 255, 0.22); }
.farm-route-explorer [data-hot] path[pathlength] { stroke-dasharray: 1; stroke-dashoffset: 1px; animation: farm-route-draw .52s cubic-bezier(.22, 1, .36, 1) var(--route-draw-delay,0s) forwards; }
.farm-route-text { fill: rgba(255, 255, 255, 0.46); font-family: var(--font-geist-mono), ui-monospace, monospace; white-space: pre; font-size: 7px; }
.farm-route-strong { fill: rgba(255, 255, 255, 0.86); }
.farm-route-caption { fill: rgba(255, 255, 255, 0.4); font-size: 6.5px; }
.farm-route-caret { animation: 1s step-end 0s infinite normal none running farm-route-caret; }
@media (prefers-reduced-motion: reduce) { .farm-route-explorer [data-hot] path[pathlength], .farm-route-wire path { stroke-dashoffset: 0; animation: auto ease 0s 1 normal none running none; } }
@media (prefers-reduced-motion: reduce) { .farm-route-caret { animation: auto ease 0s 1 normal none running none; } }
.benchmark-hairline :-webkit-any(polygon, path, ellipse) { fill: rgb(0, 0, 0); stroke: rgba(255, 255, 255, 0.3); stroke-width: 1px; stroke-linejoin: round; vector-effect: non-scaling-stroke; transition: stroke 0.18s linear; }
.benchmark-hairline :is(polygon, path, ellipse) { fill: rgb(0, 0, 0); stroke: rgba(255, 255, 255, 0.3); stroke-width: 1px; stroke-linejoin: round; vector-effect: non-scaling-stroke; transition: stroke 0.18s linear; }
.benchmark-hairline [data-hot] :-webkit-any(polygon, path, ellipse) { stroke: rgba(255, 255, 255, 0.6); }
.benchmark-hairline [data-hot] :is(polygon, path, ellipse) { stroke: rgba(255, 255, 255, 0.6); }
.iso-scene :-webkit-any(polygon, path, ellipse) { stroke: rgba(255, 255, 255, 0.2); stroke-width: 1px; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.iso-scene :is(polygon, path, ellipse) { stroke: rgba(255, 255, 255, 0.2); stroke-width: 1px; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.iso-scene .iso-lane :-webkit-any(polygon, ellipse, text, tspan) { transition: fill 0.16s linear, stroke 0.16s linear; }
.iso-scene .iso-lane :is(polygon, ellipse, text, tspan) { transition: fill 0.16s linear, stroke 0.16s linear; }
@keyframes farm-route-draw { 
  100% { stroke-dashoffset: 0; }
}
@keyframes farm-route-caret { 
  50% { opacity: 0; }
