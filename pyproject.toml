[project]
name = "pager"
version = "0.1.0"
description = "Incident-response agent swarm"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "faker>=40.43.0",
  "langgraph>=1.2.18",
  "langgraph-checkpoint-postgres>=3.2.0",
  "openai>=3.39.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pager"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
